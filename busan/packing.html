<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>釜山打包清單 10/21～10/25</title>
  <link rel="stylesheet" href="busan.css?v=2">
  <script src="busan.js?v=2" defer></script>
</head>
<body data-page="packing">
  <main class="page">
    <section class="hero">
      <svg class="sky-deco" viewBox="0 0 360 150" preserveAspectRatio="xMaxYMin meet" aria-hidden="true">
        <circle class="sun-glow" cx="318" cy="40" r="36"/>
        <circle class="sun" cx="318" cy="40" r="22"/>
        <g class="cloud cloud-a">
          <circle cx="60" cy="62" r="16"/><circle cx="80" cy="52" r="22"/><circle cx="104" cy="60" r="17"/>
          <rect x="44" y="60" width="76" height="18" rx="9"/>
        </g>
        <g class="cloud cloud-b">
          <circle cx="212" cy="104" r="12"/><circle cx="228" cy="96" r="17"/><circle cx="246" cy="104" r="12"/>
          <rect x="200" y="102" width="58" height="14" rx="7"/>
        </g>
        <g class="cloud cloud-c">
          <circle cx="282" cy="118" r="9"/><circle cx="294" cy="112" r="12"/><circle cx="307" cy="118" r="9"/>
          <rect x="273" y="117" width="43" height="10" rx="5"/>
        </g>
        <path class="gull gull-a" d="M150 46 q9 -10 18 0 q9 -10 18 0"/>
        <path class="gull gull-b" d="M186 24 q7 -8 14 0 q7 -8 14 0"/>
        <path class="gull gull-c" d="M250 62 q6 -7 12 0 q6 -7 12 0"/>
      </svg>
      <a class="back-link" href="../busan.html">← 回釜山主畫面</a>
      <div class="eyebrow">🧳 10/21～10/25</div>
      <h1>釜山打包清單</h1>
      <p class="subtitle">打勾會記在這台手機裡，收行李時一項一項劃掉。</p>
      <div class="weather-banner">🌤️ 白天 17～20°C｜🌙 早晚 8～10°C｜💨 晴天風大</div>
      <div class="toolbar">
        <div class="progress-line">已打包 <span data-count>0 / 0</span></div>
        <button type="button" class="btn-reset" data-reset>全部清除</button>
      </div>
    </section>

    <svg class="wave-divider" viewBox="0 0 780 22" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 12 C65 2 130 22 195 12 S325 2 390 12 S520 22 585 12 S715 2 780 12 V22 H0 Z"/>
    </svg>

    <section class="tips-card">
      <h2>🧥 衣服（每人）</h2>
      <ul class="check-list">
        <li class="check-item" data-item><label><input type="checkbox" data-key="clothes-top"><span class="check-box"></span><span class="check-text">長袖上衣 × 4～5 件</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="clothes-knit"><span class="check-box"></span><span class="check-text">針織衫／薄毛衣 × 1～2 件</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="clothes-coat"><span class="check-box"></span><span class="check-text">保暖外套 × 1 件（擋風最重要）<small class="check-note">⚠️ 搭機時穿在身上或放隨身包</small></span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="clothes-light"><span class="check-box"></span><span class="check-text">薄外套 × 1 件（白天爬坡用）</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="clothes-pants"><span class="check-box"></span><span class="check-text">長褲 × 2～3 件</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="clothes-heat"><span class="check-box"></span><span class="check-text">發熱衣 × 1～2 件（怕冷的人）</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="clothes-under"><span class="check-box"></span><span class="check-text">睡衣、貼身衣物、襪子</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="clothes-scarf"><span class="check-box"></span><span class="check-text">圍巾或脖圍（海邊、夜景用）</span></label></li>
      </ul>
    </section>

    <section class="tips-card">
      <h2>👟 鞋子＆配件</h2>
      <ul class="check-list">
        <li class="check-item" data-item><label><input type="checkbox" data-key="shoes-walk"><span class="check-box"></span><span class="check-text">好走的防滑鞋<small class="check-note">甘川、龍宮寺很多階梯</small></span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="shoes-hat"><span class="check-box"></span><span class="check-text">帽子（可固定的，纜車風大）</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="shoes-sunglasses"><span class="check-box"></span><span class="check-text">太陽眼鏡</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="shoes-umbrella"><span class="check-box"></span><span class="check-text">折傘 1～2 把（備用）</span></label></li>
      </ul>
    </section>

    <section class="tips-card">
      <h2>🧴 保養＆防曬</h2>
      <ul class="check-list">
        <li class="check-item" data-item><label><input type="checkbox" data-key="care-sunscreen"><span class="check-box"></span><span class="check-text">防曬乳（這幾天都是晴天）</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="care-lip"><span class="check-box"></span><span class="check-text">護唇膏、乳液（風大會乾）</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="care-tooth"><span class="check-box"></span><span class="check-text">牙刷、牙膏<small class="check-note">韓國很多飯店不提供拋棄式備品</small></span></label></li>
      </ul>
    </section>

    <section class="tips-card">
      <h2>💊 常用藥</h2>
      <ul class="check-list">
        <li class="check-item" data-item><label><input type="checkbox" data-key="med-cold"><span class="check-box"></span><span class="check-text">感冒藥（溫差大）</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="med-stomach"><span class="check-box"></span><span class="check-text">腸胃藥</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="med-patch"><span class="check-box"></span><span class="check-text">痠痛貼布（走很多階梯）</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="med-chronic"><span class="check-box"></span><span class="check-text">個人慢性病用藥</span></label></li>
      </ul>
    </section>

    <section class="tips-card">
      <h2>📄 證件＆錢</h2>
      <ul class="check-list">
        <li class="check-item" data-item><label><input type="checkbox" data-key="doc-passport"><span class="check-box"></span><span class="check-text">護照（拍照存手機）</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="doc-ticket"><span class="check-box"></span><span class="check-text">機票／訂房確認<small class="check-note">去程 KE2086 10/21 桃園第一航廈 12:00｜回程 KE2085 10/25 金海 14:50</small></span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="doc-hotel"><span class="check-box"></span><span class="check-text">飯店韓文地址截圖</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="doc-cash"><span class="check-box"></span><span class="check-text">韓圓現金（路邊攤、市場用）</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="doc-cards"><span class="check-box"></span><span class="check-text">信用卡<small class="check-note">富邦Costco、永豐大戶、台新街口卡、Richart</small></span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="doc-linepay"><span class="check-box"></span><span class="check-text">LINE Pay 已綁台新 Visa 卡</span></label></li>
      </ul>
    </section>

    <section class="tips-card">
      <h2>🔌 電子用品</h2>
      <ul class="check-list">
        <li class="check-item" data-item><label><input type="checkbox" data-key="elec-phone"><span class="check-box"></span><span class="check-text">手機＆充電線</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="elec-adapter"><span class="check-box"></span><span class="check-text">轉接頭（韓國 220V 圓孔）</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="elec-powerbank"><span class="check-box"></span><span class="check-text">行動電源<small class="check-note">⚠️ 一定要隨身，不能托運</small></span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="elec-esim"><span class="check-box"></span><span class="check-text">eSIM 先安裝好、測試過</span></label></li>
      </ul>
    </section>

    <section class="tips-card">
      <h2>✈️ 出發前確認</h2>
      <ul class="check-list">
        <li class="check-item" data-item><label><input type="checkbox" data-key="pre-weather"><span class="check-box"></span><span class="check-text">10/20 再查一次天氣</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="pre-costco"><span class="check-box"></span><span class="check-text">富邦Costco 登錄海外活動</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="pre-richart"><span class="check-box"></span><span class="check-text">Richart 切換「玩旅刷」</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="pre-dawho"><span class="check-box"></span><span class="check-text">永豐大戶等級確認</span></label></li>
      </ul>
    </section>

    <section class="tips-card">
      <h2>💡 回程提醒</h2>
      <ul class="check-list">
        <li class="check-item" data-item><label><input type="checkbox" data-key="back-liquid"><span class="check-box"></span><span class="check-text">液體、醬料、泡菜、面膜放托運</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="back-battery"><span class="check-box"></span><span class="check-text">行動電源、鋰電池放隨身</span></label></li>
        <li class="check-item" data-item><label><input type="checkbox" data-key="back-space"><span class="check-box"></span><span class="check-text">行李箱留空間放伴手禮</span></label></li>
      </ul>
      <p class="note-line">勾選只存在這台手機的瀏覽器，換裝置不會同步。</p>
    </section>
    <p class="back-bottom"><a class="back-link" href="../busan.html">← 回釜山主畫面</a></p>
  </main>
</body>
</html>
